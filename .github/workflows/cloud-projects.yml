name: Cloud project contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:cloud
      - run: npm run typecheck:cloud
      - run: npm ci --prefix services/project-cloud
      - run: node services/project-cloud/node_modules/typescript/bin/tsc -p services/project-cloud/tsconfig.json --noEmit
      - run: npm run build:cloud
