[package]
name = "breadbit-desktop"
version = "0.1.0"
description = "BreadBit local electronics workspace"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "breadbit_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
